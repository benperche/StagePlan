<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StagePlan Seating Chart Generator</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>StagePlan <span class="h1-sub">Seating Chart Generator</span></h1>

      <section class="panel">
        <h2>Chart</h2>
        <label>Title
          <input type="text" id="title" value="Seating Chart" />
        </label>
        <label>Layout
          <select id="layout">
            <option value="semicircle">Semicircle</option>
            <option value="straight">Straight rows</option>
          </select>
        </label>
        <label id="straight-rows-label">Straight rows from back
          <input type="number" id="straight-rows" min="0" value="0" />
        </label>
        <div class="checkbox-row">
          <label><input type="checkbox" id="show-numbers" checked /> Seat numbers</label>
          <label><input type="checkbox" id="restart-numbers" /> Restart per row</label>
        </div>
        <div class="checkbox-row">
          <label><input type="checkbox" id="show-row-labels" /> Row labels</label>
          <label><input type="checkbox" id="flip" /> Flip layout</label>
        </div>
        <div class="checkbox-row">
          <label><input type="checkbox" id="conductor-stand" checked /> Conductor stand</label>
          <label><input type="checkbox" id="show-arc" /> Show arc</label>
        </div>
      </section>

      <section class="panel">
        <h2>Preset Arrangements</h2>
        <div class="row-controls">
          <select id="preset-select">
            <option value="" disabled selected>Choose a preset…</option>
          </select>
          <button id="apply-preset-btn">Apply</button>
        </div>
        <p class="hint">Applies a standard layout — you can edit it after.</p>
      </section>

      <section class="panel">
        <h2>Rows</h2>
        <div id="rows-container"></div>
        <button id="add-row-btn" class="secondary">+ Add row</button>
      </section>

      <section class="panel">
        <h2>Edit Chairs</h2>
        <div class="tool-group">
          <button data-tool="color" class="tool-btn active">Color</button>
          <button data-tool="toggle" class="tool-btn">Enable/Disable</button>
          <button data-tool="stand" class="tool-btn">Music Stand</button>
        </div>
        <label>Color
          <input type="color" id="color-picker" value="#a8d8ea" />
        </label>
        <p class="hint">Click a chair on the canvas to apply the selected tool.</p>
      </section>

      <section class="panel">
        <h2>Notes</h2>
        <textarea id="notes" rows="3" placeholder="Notes for this chart…"></textarea>
      </section>

      <section class="panel">
        <h2>History</h2>
        <div class="row-controls">
          <button id="undo-btn" disabled>↩ Undo</button>
          <button id="redo-btn" disabled>↪ Redo</button>
        </div>
      </section>

      <section class="panel">
        <h2>Save &amp; Export</h2>
        <button id="save-btn">⬇ Save JSON</button>
        <label class="file-label">
          ⬆ Load JSON
          <input type="file" id="load-input" accept=".json" />
        </label>
        <button id="export-png-btn">🖼 Export PNG</button>
        <button id="share-link-btn">🔗 Copy share link</button>
        <div id="share-url-display" style="display:none"></div>
      </section>
    </aside>

    <main id="canvas-area">
      <canvas id="chart-canvas"></canvas>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
