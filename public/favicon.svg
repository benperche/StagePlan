<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark navy background -->
  <rect width="100" height="100" rx="16" fill="#1a1a2e"/>

  <!-- Three concentric arcs (orchestra rows, 210°–330°, center at 50,85) -->

  <!-- Outer row: r=45 -->
  <!-- 210°: (11.0, 62.5)  270°: (50, 40)  330°: (89.0, 62.5) -->
  <path d="M 11,62.5 A 45,45 0 0,1 89,62.5"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

  <!-- Middle row: r=30 -->
  <!-- 210°: (24.0, 70)  270°: (50, 55)  330°: (76.0, 70) -->
  <path d="M 24,70 A 30,30 0 0,1 76,70"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.88"/>

  <!-- Inner row: r=15 -->
  <!-- 210°: (37.0, 77.5)  270°: (50, 70)  330°: (63.0, 77.5) -->
  <path d="M 37,77.5 A 15,15 0 0,1 63,77.5"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Conductor: blue accent dot -->
  <circle cx="50" cy="91" r="5.5" fill="#2563eb"/>
</svg>
